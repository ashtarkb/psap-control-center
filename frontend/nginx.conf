map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Exact match for the bare jobs-list endpoint (no trailing slash).
    # Without this, the prefix location below — which ends in "/" and
    # uses proxy_pass — makes nginx auto-redirect this URI with a 301
    # to "<scheme>://<host>:<server_port>/.../jobs/", using nginx's own
    # (plain-HTTP, port 8080) view of itself rather than the real
    # HTTPS route the browser is on. That redirect gets blocked by the
    # browser as mixed content, so the jobs list silently fails to load.
    # See: https://nginx.org/en/docs/http/ngx_http_core_module.html#location
    location = /api/v1/fournos/jobs {
        proxy_pass http://psap-control-center-backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    # SSE log streaming for fournos jobs (unbuffered, long timeout)
    location /api/v1/fournos/jobs/ {
        proxy_pass http://psap-control-center-backend:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location /api {
        proxy_pass http://psap-control-center-backend:8000;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
