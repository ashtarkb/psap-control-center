schema_version: 1
project: mcp_gateway
title: MCP Gateway
description: >
  mcp_gateway presets.d is a flat pool of named presets with no dimension
  tagging — a single preset picker is all that's needed.

modes:
  - id: single
    label: Submit Job
    default: true
    sections:
      - id: run
        label: Run
        fields:
          - key: preset
            label: Preset
            type: select
            required: true
            options_ref: {dir: presets.d, preset_pool: true}
          - key: gateway_version
            label: Gateway Version
            type: text
            placeholder: main
            maps_to: infrastructure.mcp_gateway_version
