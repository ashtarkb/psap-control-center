schema_version: 1
project: llm_d
title: llm-d
description: >
  llm-d presets are already split one-dimension-per-file (no shared
  self-tagged pool), and compose via Forge's own `extends` mechanism —
  so each field here points at its own file via `options_ref` and the
  selected preset key is passed straight through as an arg; the Control
  Center does not attempt to resolve `extends` chains itself.

modes:
  - id: single
    label: Submit Job
    default: true
    sections:
      - id: model
        label: Model
        fields:
          - key: model
            label: Model
            type: select
            required: true
            options_ref: {path: presets.d/models.yaml, preset_pool: true}
      - id: deployment
        label: Deployment
        fields:
          - key: deployment_preset
            label: Deployment Preset
            type: select
            required: true
            options_ref: {path: presets.d/presets.yaml, preset_pool: true}
          - key: cluster
            label: Cluster Config
            type: select
            options_ref: {path: presets.d/cluster_config.yaml, preset_pool: true}
          - key: benchmark
            label: Benchmark
            type: select
            options_ref: {path: presets.d/benchmarks.yaml, preset_pool: true}
          - key: rhoai_channel
            label: RHOAI Channel
            type: select
            options_ref: {path: presets.d/rhoai-rc.yaml, preset_pool: true}
      - id: cpt
        label: CPT (optional)
        fields:
          # llm_d's own "CPT" presets (presets.d/cpt.yaml) are plain Forge
          # presets composed via `extends` — not a model×workload matrix
          # like RHAIIS's — so this is just another arg field, same as
          # `deployment_preset` above.
          - key: cpt_profile
            label: CPT Profile
            type: select
            options_ref: {path: presets.d/cpt.yaml, preset_pool: true}

      - id: run_settings
        label: Run Settings
        fields:
          - key: raw_overrides
            label: Additional Config Overrides (JSON)
            type: textarea
            placeholder: '{"runtime.namespace": "my-dev-ns"}'
